# MATRIX Experiment F - feature ablation. Frozen record.
experiment:
  name: feature_ablation
  question: Do the additional X_ext channels improve prediction AND dead reckoning?
  independent_variable: input feature set ONLY
  conclusion: NO reliable effect -> keep the 6-feature model

held_constant:
  target: dv k=5 + yaw_rate (unchanged from the frozen dv experiment)
  architecture: Conv1D -> Conv1D -> GRU -> Dense -> 2 (unchanged)
  seed: 1337
  optimizer: Adam
  learning_rate: 0.001
  batch_size: 256
  max_epochs: 80
  early_stopping_patience: 12
  scheduler: ReduceLROnPlateau(factor=0.5, patience=4, min_lr=1e-6)
  deterministic: true
  data: strict high-confidence VBOX only; existing split; existing windows
  scaler: existing train-only scaler, subset by channel index (never refitted)
  fusion: FROZEN Experiment-E complementary filter, tau=20 s, k=5, dt=0.1 (not retuned)

parameter_counts:
  A_imu6: 150914
  C_imu_mag: 151554
  B_imu_linacc: 151874
  D_all11: 152514
  note: >
    The input convolution necessarily widens with more channels (+1600 params for 11 vs 6,
    +1.1%). No other dimension was increased.

feature_sets:
  A_imu6: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z]
  B_imu_linacc: A + [linear_acc_x, linear_acc_y, linear_acc_z]
  C_imu_mag: A + [acc_mag, gyro_mag]
  D_all11: A + linear_acc + magnitudes

not_available_in_X_ext:
  channels: [mag_x, mag_y, mag_z, ori_azimuth_deg, ori_pitch_deg, ori_roll_deg,
             gravity_x, gravity_y, gravity_z]
  consequence: >
    The requested ablation groups "+ magnetometer" and "+ orientation" COULD NOT be run.
    X_ext contains only the 11 channels listed above. Adding magnetometer/orientation would
    require re-windowing the dataset, which the experiment rules forbid.

frozen_decision: see frozen_decision.json
